[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shtlng-bpmn-ruby-compiler"
version = "0.1.0"
description = "BPMN 2.0 to FlowSpec DSL, Formal Automata Analyzer (NFA/DFA/RegEx), and Ruby on Rails/Sidekiq Code Generator"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
]

